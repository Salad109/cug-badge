<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Activation</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--text-color);
        }
        .mac-display {
            text-align: center;
            font-size: 0.85em;
            color: #6c757d;
            background: #e9ecef;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.15s ease-in-out;
        }
        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .msg-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="card">
    <h2>Activate Badge</h2>
    <div id="macDisplay" class="mac-display">No device assigned</div>
    
    <form id="registrationForm">
        <div class="form-group">
            <label for="name">First Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter your first name">
        </div>
        <div class="form-group">
            <label for="surname">Last Name</label>
            <input type="text" id="surname" name="surname" placeholder="Optional">
        </div>
        <div class="form-group">
            <label for="nickname">Nickname *</label>
            <input type="text" id="nickname" name="nickname" required placeholder="Will be displayed on screen">
        </div>
        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Optional">
        </div>
        <div class="form-group">
            <label for="position">Position / Role</label>
            <input type="text" id="position" name="position" placeholder="Optional">
        </div>
        <div class="form-group">
            <label for="eMail">Email Address</label>
            <input type="email" id="eMail" name="eMail" placeholder="Optional">
        </div>
        <button type="submit" id="submitBtn">Register</button>
    </form>
    
    <div id="messageBox" class="message"></div>
</div>

<script>
    // --- KONFIGURACJA ---
    const BACKEND_URL = 'http://localhost:8080'; 

    // Pobieranie adresu MAC z adresu URL
    const urlParams = new URLSearchParams(window.location.search);
    const macAddress = urlParams.get('mac'); 
    
    const form = document.getElementById('registrationForm');
    const macDisplay = document.getElementById('macDisplay');
    const messageBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');

    // Inicjalizacja widoku
    if (macAddress) {
        if (!urlParams.get('mac')) {
            macDisplay.textContent = `MAC: ${macAddress} (SIMULATED)`;
        } else {
            macDisplay.textContent = `MAC: ${macAddress}`;
        }
    } else {
        macDisplay.textContent = "ERROR: No MAC address provided!";
        macDisplay.style.color = "#721c24";
        macDisplay.style.backgroundColor = "#f8d7da";
        submitBtn.disabled = true;
    }

    // Funkcja do wyświetlania komunikatów
    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message msg-${type}`;
        messageBox.style.display = 'block';
    }

    // Obsługa wysyłania formularza z walidacją
    form.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        if (!macAddress) return;

        // 1. POBIERANIE I CZYSZCZENIE DANYCH (trimming)
        const name = document.getElementById('name').value.trim();
        const surname = document.getElementById('surname').value.trim();
        const nickname = document.getElementById('nickname').value.trim();
        const eMail = document.getElementById('eMail').value.trim();

        // 2. WALIDACJA PO STRONIE KLIENTA
        
        // Sprawdzenie formatu adresu MAC (XX:XX:XX:XX:XX:XX)
        const macRegex = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
        if (!macRegex.test(macAddress)) {
            showMessage("Invalid MAC address format!", "error");
            return;
        }

        // Sprawdzenie długości imienia (wymagane w API)
        if (name.length < 2) {
            showMessage("First Name must be at least 2 characters long.", "error");
            return;
        }

        // Sprawdzenie ksywki (wymagana, brak spacji)
        if (nickname.length < 2) {
            showMessage("Nickname must be at least 2 characters long.", "error");
            return;
        }
        if (/\s/.test(nickname)) {
            showMessage("Nickname cannot contain spaces.", "error");
            return;
        }

        // Sprawdzenie formatu e-mail (opcjonalne)
        if (eMail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(eMail)) {
            showMessage("Please enter a valid email address.", "error");
            return;
        }

        // 3. PRZYGOTOWANIE DO WYSYŁKI
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
        messageBox.style.display = 'none';

        const payload = {
            name: name,
            nickname: nickname
        };

        if (surname) payload.surname = surname;
        if (company) payload.company = company;
        if (position) payload.position = position;
        if (eMail) payload.eMail = eMail;

        try {
            const response = await fetch(`${BACKEND_URL}/badges/${macAddress}/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            // Obsługa kodów odpowiedzi zgodnych ze specyfikacją
            if (response.status === 201) {
                showMessage("Badge successfully activated!", "success");
                form.reset();
                submitBtn.style.display = 'none'; 
            } else if (response.status === 409) {
                showMessage("This device is already assigned to another person.", "warning");
                submitBtn.disabled = false;
            } else {
                showMessage(`Server error (Code: ${response.status}).`, "error");
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error("Network error:", error);
            showMessage("Connection error. Please check if the server is running.", "error");
            submitBtn.disabled = false;
        } finally {
            if (submitBtn.style.display !== 'none') {
                submitBtn.textContent = "Register";
            }
        }
    });
</script>

</body>
</html>   }
        }
    });
</script>

</body>
</html>
