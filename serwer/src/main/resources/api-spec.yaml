openapi: 3.0.3
info:
  title: Serwer API
  version: 1.0.0
paths:
  /users:
    get:
      tags:
        - Users
      summary: Retrieves a list of users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
        - Admin
      summary: Manually creates a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created
        '409':
          description: MAC address already occupied

  /users/{id}:
    put:
      tags:
        - Users
        - Admin
      summary: Updates an existing user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found

  /badges/{mac_address}/user:
    get:
      tags:
        - Badges
      summary: Retrieves user information based on mac address
      parameters:
        - name: mac_address
          in: path
          required: true
          description: MAC ESP32 address
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Badge is not assigned to specific user (Show QR code on esp)

  /badges/{mac_address}/register:
    post:
      tags:
       - Badges
       - Registration
      summary: Registers new user with given mac address
      parameters:
        - name: mac_address
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Succesfully registered user
        '409':
          description: MAC address already occupied

  /badges/{mac_address}/unlink:
    post:
      tags:
       - Badges
       - Registration
      summary: Unlinks the mac address from specific user
      parameters:
        - name: mac_address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Succesfully unlinked the user

  /badges/unlink-all:
    post:
      tags:
       - Badges
       - Admin
      summary: Unlinks all of the mac adresses from users (End of event function)
      responses:
        '200':
          description: Succesfully unlinked all badges

  /sectors:
    get:
      tags:
        - Sectors
        - Admin
      summary: Retrieves a list of sectors (LoRa gateways)
      responses:
        '200':
          description: List of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
    post:
      tags:
        - Sectors
        - Admin
      summary: Adds a new sector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
      responses:
        '201':
          description: Sector created

  /sectors/{id}:
    delete:
      tags:
        - Sectors
        - Admin
      summary: Deletes a sector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Sector deleted

  /admin/messages:
    post:
      tags:
        - Messaging
        - Admin
      summary: Sends a message to badges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '202':
          description: Message accepted for delivery

  /groups:
    get:
      tags:
        - Groups
        - Admin
      summary: Retrieves a list of groups
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags:
        - Groups
        - Admin
      summary: Adds a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '201':
          description: Group created

  /groups/{id}:
    get:
      tags:
        - Groups
        - Admin
      summary: Retrieves group details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
    delete:
      tags:
        - Groups
        - Admin
      summary: Deletes a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Group deleted

  /groups/{id}/members/{userId}:
    post:
      tags:
        - Groups
        - Admin
      summary: Adds a user to a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User added to group
        '404':
          description: Group or User not found
    delete:
      tags:
        - Groups
        - Admin
      summary: Removes a user from a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User removed from group

components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/User'

    GroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Sector:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        gatewayUrl:
          type: string

    SectorRequest:
      type: object
      required:
        - name
        - gatewayUrl
      properties:
        name:
          type: string
        gatewayUrl:
          type: string

    MessageRequest:
      type: object
      required:
        - targetType
        - content
      properties:
        targetType:
          type: string
          enum: [BROADCAST, SECTOR, MAC, GROUP]
        targetId:
          type: string
          description: Sector ID, MAC address, or Group ID (ignored for BROADCAST)
        content:
          type: string
          maxLength: 150
        category:
          type: string
          enum: [INFO, WARNING, SPONSOR, ALERT]
          default: INFO

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        nickname:
          type: string
        eMail:
          type: string
        macAddress:
          type: string
        role:
          type: string
          enum: [USER, VIP, SPEAKER, ADMIN, STAFF]
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'

    UserRegistrationRequest:
      type: object
      required:
        - name
        - nickname
      properties:
        name:
          type: string
        surname:
          type: string
        nickname:
          type: string
        eMail:
          type: string