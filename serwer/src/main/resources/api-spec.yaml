openapi: 3.0.3
info:
  title: Serwer API
  version: 1.0.0
paths:
  /users:
    get:
      tags:
        - Users
      summary: Retrieves a list of users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /badges/{mac_address}/user:
    get:
      tags:
        - Badges
      summary: Retrieves user information based on mac address
      parameters:
        - name: mac_address
          in: path
          required: true
          description: MAC ESP32 address
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Badge is not assigned to specific user (Show QR code on esp)

  /badges/{mac_address}/register:
    post:
      tags:
       - Badges
       - Registration
      summary: Registers new user with given mac address
      parameters:
        - name: mac_address
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Succesfully registered user
        '409':
          description: MAC address already occupied

  /badges/{mac_address}/unlink:
    post:
      tags:
       - Badges
       - Registration
      summary: Unlinks the mac address from specific user
      parameters:
        - name: mac_address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Succesfully unlinked the user

  /badges/unlink-all:
    post:
      tags:
       - Badges
       - Admin
      summary: Unlinks all of the mac adresses from users (End of event function)
      responses:
        '200':
          description: Succesfully unlinked all badges

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        nickname:
          type: string
        eMail:
          type: string
        macAddress:
          type: string
        role:
          type: string
          enum: [USER, VIP, SPEAKER, ADMIN, STAFF]
        accessGroup:
          type: integer

    UserRegistrationRequest:
      type: object
      required:
        - name
        - nickname
      properties:
        name:
          type: string
        surname:
          type: string
        nickname:
          type: string
        eMail:
          type: string